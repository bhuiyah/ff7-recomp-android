plugins { id 'com.android.application' }

android {
    namespace 'com.ff7recomp'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.ff7recomp'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    buildTypes {
        // The lifted game is ~10 M lines of C: build it optimised even for debug APKs.
        debug { jniDebuggable true }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.30.5' } }
    // FFNx's run-time files (tools/stage_apk_assets.sh) ship in the APK as assets/ffnx.
    sourceSets { main { assets.srcDirs += ["${rootDir}/../build/apk-assets"] } }
}

dependencies {
    // Catalog mods ship as .7z (and .zip): Commons Compress reads them, XZ provides LZMA/LZMA2.
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation 'org.tukaani:xz:1.9'
}
